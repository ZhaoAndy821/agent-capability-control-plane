<!doctype html><meta charset="utf-8"><title>ACCP Registry</title><style>body{font-family:system-ui;margin:24px}input{padding:10px;width:70%}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #ddd;padding:6px}.hide{display:none}</style><h1>Agent Capability Registry</h1><input id="q" placeholder="Search"><table><thead><tr><th>ID</th><th>Name</th><th>Kind</th><th>Adoption</th><th>Trust</th><th>Risk</th><th>Source</th></tr></thead><tbody></tbody></table><script>q.oninput=()=>{let s=q.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hide',s&&!r.dataset.text.includes(s)))}</script>
